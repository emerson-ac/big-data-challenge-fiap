# eksctl ClusterConfig — declarativo e versionado.
# Cria um cluster EKS com VPC própria (genérico, sem dependência de VPC externa).
# Aplicar com: eksctl create cluster -f cluster/cluster.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: recsys-challenge
  region: us-east-1
  version: "1.32"
  tags:
    project: recsys-challenge
    managedBy: eksctl

# OIDC habilita IRSA (roles para o LB Controller e acesso ao S3).
iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      wellKnownPolicies:
        awsLoadBalancerController: true
    - metadata:
        name: sa-model-s3
        namespace: models
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
  - name: metrics-server

managedNodeGroups:
  - name: ng-public
    amiFamily: AmazonLinux2023
    instanceType: t3.large
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 30
    privateNetworking: false
    labels:
      role: worker
    tags:
      project: recsys-challenge
