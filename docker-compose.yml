# Local orchestration: API + MLflow tracking server.
# Start with: docker compose up --build
# API: http://localhost:8000/docs   MLflow UI: http://localhost:5000

services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: mlruns
    volumes:
      - ./mlruns:/app/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      mlflow:
        condition: service_started

  mlflow:
    build:
      context: .
      target: runtime
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /app/mlruns
