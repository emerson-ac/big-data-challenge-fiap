# Local orchestration: MLflow server + training pipeline + API (registry serving).
# Start with: docker compose up --build
# API: http://localhost:8000/docs   MLflow UI: http://localhost:5000
#
# Flow: mlflow server starts -> `train` runs the full pipeline (synthetic data
# -> preprocess -> train -> evaluate), logging every run to MLflow and
# registering/promoting the best model (Staging -> Production, alias
# @production) -> `api` loads the Production model from the registry via
# http://mlflow:5000, using the shared volumes for the vocabulary and the
# popularity fallback.

services:
  mlflow:
    build:
      context: .
      target: runtime
    user: root
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/tmp/mlruns
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////tmp/mlflow.db
      --serve-artifacts --artifacts-destination /tmp/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  train:
    build:
      context: .
      target: runtime
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: >
      sh -c "python scripts/gen_synthetic_data.py &&
             python -u -m src.pipeline.preprocess &&
             python -u -m src.pipeline.train &&
             python -u -m src.pipeline.evaluate"
    volumes:
      - models_data:/app/models
      - processed_data:/app/data/processed
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_SOURCE: registry
    volumes:
      - models_data:/app/models
      - processed_data:/app/data/processed
    depends_on:
      train:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mlflow_data:
  models_data:
  processed_data:
