# Autoscaling horizontal por CPU (o metrics-server já é instalado como addon
# do cluster — ver cluster/cluster.yaml). Espelha o min/max do predictor KServe.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recsys-api
  namespace: models
  labels:
    app: recsys-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recsys-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
