# Ingress ALB público para a API de recomendação.
# O AWS Load Balancer Controller cria um ALB internet-facing a partir daqui.
#
# Para HTTPS: descomente as annotations de certificado e ssl-redirect,
# substituindo o ARN pelo seu certificado ACM.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recsys-api
  namespace: models
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<region>:<account>:certificate/<id>
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: recsys-api
                port:
                  number: 80
