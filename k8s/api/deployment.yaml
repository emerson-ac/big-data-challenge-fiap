# Deployment da API de recomendação (FastAPI/uvicorn) no cluster existente.
#
# Reaproveita a infra do bônus KServe/EKS:
#   - namespace `models` e a ServiceAccount `sa-model-s3` (IRSA, S3 read-only),
#     ambos criados pelo eksctl a partir de cluster/cluster.yaml;
#   - AWS Load Balancer Controller já instalado por scripts/deploy.sh.
#
# Os artefatos do modelo NÃO são embutidos na imagem: um initContainer os baixa
# de um bucket S3 (aws s3 sync) para volumes emptyDir, montados sobre
# /app/models e /app/data — os mesmos caminhos relativos que src/models/inference.py
# usa a partir do WORKDIR /app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recsys-api
  namespace: models
  labels:
    app: recsys-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recsys-api
  template:
    metadata:
      labels:
        app: recsys-api
    spec:
      # IRSA: dá ao pod as credenciais S3 (AmazonS3ReadOnlyAccess) sem chaves.
      serviceAccountName: sa-model-s3
      initContainers:
        # Baixa artefatos (item_similarity.npz, vocabularies.pkl, interactions_prior.npz,
        # ranking.pkl, ...) do S3 para os volumes compartilhados antes da API subir.
        - name: fetch-artifacts
          image: public.ecr.aws/aws-cli/aws-cli:latest
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: MODELS_BUCKET
              # Ajuste para o seu bucket (default = PoC original).
              value: arcobridgegitops-models-177300752486
            - name: S3_PREFIX
              value: recsys-api
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Sincronizando artefatos de s3://${MODELS_BUCKET}/${S3_PREFIX}/ ..."
              aws s3 sync "s3://${MODELS_BUCKET}/${S3_PREFIX}/models/" /app/models/ --no-progress
              aws s3 sync "s3://${MODELS_BUCKET}/${S3_PREFIX}/data/processed/" /app/data/processed/ --no-progress
              echo "Artefatos baixados:"
              ls -R /app/models /app/data/processed
          volumeMounts:
            - name: models
              mountPath: /app/models
            - name: data
              mountPath: /app/data
      containers:
        - name: api
          # Imagem construída a partir do Dockerfile na RAIZ (uvicorn src.api.main:app :8000).
          # TODO: publique no seu registry (ECR/GHCR) e ajuste aqui.
          image: REGISTRY/recsys-api:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: RECSYS_MODEL_TYPE
              value: item_based_cf
            # Carrega o modelo do MLflow Registry (@production). Requer egress ao
            # servidor MLflow. Use "local" para servir dos artefatos do S3.
            - name: RECSYS_MODEL_SOURCE
              value: registry
            - name: RECSYS_MLFLOW_TRACKING_URI
              value: https://mlflow.pocsarcotech.com
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: models
              mountPath: /app/models
            - name: data
              mountPath: /app/data
      volumes:
        - name: models
          emptyDir: {}
        - name: data
          emptyDir: {}
