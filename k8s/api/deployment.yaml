# Deployment da API de recomendação (FastAPI/uvicorn) no EKS.
#
# Os artefatos do modelo NÃO são embutidos na imagem: um initContainer os baixa
# de um bucket S3 (aws s3 sync) para volumes emptyDir, montados sobre
# /app/models e /app/data — os caminhos que src/models/inference.py usa.
#
# Requer:
#   - namespace `models` e SA `sa-model-s3` (IRSA, S3 read-only) — criados pelo
#     eksctl a partir de cluster/cluster.yaml;
#   - AWS Load Balancer Controller — instalado por scripts/deploy.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recsys-api
  namespace: models
  labels:
    app: recsys-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recsys-api
  template:
    metadata:
      labels:
        app: recsys-api
    spec:
      serviceAccountName: sa-model-s3
      initContainers:
        - name: fetch-artifacts
          image: public.ecr.aws/aws-cli/aws-cli:latest
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: MODELS_BUCKET
              # Ajuste para o seu bucket (ex: recsys-challenge-models-<account-id>).
              value: REPLACE_WITH_YOUR_BUCKET
            - name: S3_PREFIX
              value: recsys-api
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Sincronizando artefatos de s3://${MODELS_BUCKET}/${S3_PREFIX}/ ..."
              aws s3 sync "s3://${MODELS_BUCKET}/${S3_PREFIX}/models/" /app/models/ --no-progress
              aws s3 sync "s3://${MODELS_BUCKET}/${S3_PREFIX}/data/processed/" /app/data/processed/ --no-progress
              echo "Artefatos baixados:"
              ls -R /app/models /app/data/processed
          volumeMounts:
            - name: models
              mountPath: /app/models
            - name: data
              mountPath: /app/data
      containers:
        - name: api
          # Imagem construída a partir do Dockerfile na raiz (uvicorn :8000).
          # Publique no seu registry (ECR/GHCR/Docker Hub) e ajuste aqui.
          image: REGISTRY/recsys-api:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_SOURCE
              value: local
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: models
              mountPath: /app/models
            - name: data
              mountPath: /app/data
      volumes:
        - name: models
          emptyDir: {}
        - name: data
          emptyDir: {}
