# Deployment da API de recomendação (FastAPI/uvicorn) no EKS.
#
# O modelo principal é carregado do MLflow Model Registry externo
# (RECSYS_MODEL_SOURCE=registry, alias @production). O initContainer baixa
# apenas os dois artefatos de runtime que a API ainda precisa em disco:
#   - vocabularies.pkl  (mapeamento user/produto → índice interno)
#   - ranking.pkl       (fallback de popularidade para cold-start)
#
# Requer (todos pré-existentes no cluster arcobridgegitops):
#   - namespace `models` e SA `sa-model-s3` (IRSA, S3 read-only);
#   - AWS Load Balancer Controller em kube-system (compartilhado — não
#     reinstalar: atende os Ingress de todos os namespaces).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recsys-api
  namespace: models
  labels:
    app: recsys-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recsys-api
  template:
    metadata:
      labels:
        app: recsys-api
    spec:
      serviceAccountName: sa-model-s3
      initContainers:
        - name: fetch-artifacts
          image: public.ecr.aws/aws-cli/aws-cli:latest
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: MODELS_BUCKET
              value: arcobridgegitops-models-177300752486
            - name: S3_PREFIX
              value: recsys-api
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Baixando vocabulario e fallback de popularidade..."
              aws s3 cp "s3://${MODELS_BUCKET}/${S3_PREFIX}/data/processed/vocabularies.pkl" \
                /app/data/processed/vocabularies.pkl --no-progress
              aws s3 cp "s3://${MODELS_BUCKET}/${S3_PREFIX}/models/baseline_popularity/ranking.pkl" \
                /app/models/baseline_popularity/ranking.pkl --no-progress
              echo "Artefatos prontos."
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: models
              mountPath: /app/models
      containers:
        - name: api
          image: mmacanmunhoz/recsys-api:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_SOURCE
              value: registry
            - name: MLFLOW_TRACKING_URI
              value: https://mlflow.pocsarcotech.com
          readinessProbe:
            httpGet:
              path: /health/status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: models
              mountPath: /app/models
      volumes:
        - name: data
          emptyDir: {}
        - name: models
          emptyDir: {}
